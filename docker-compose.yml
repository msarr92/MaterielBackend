services:

  postgres:
    image: postgres:16-alpine

    container_name: materiel_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-bd_materiel_onas}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-bd_materiel_onas}"
        ]

      interval: 5s
      timeout: 5s
      retries: 20


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: materiel_backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env.docker

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - laravel_storage:/var/www/html/storage


volumes:
  postgres_data:
  laravel_storage:
