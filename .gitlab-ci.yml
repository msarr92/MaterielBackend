image: php:8.4-cli-alpine

stages:
  - install
  - quality
  - test
  - security

variables:
  APP_ENV: "testing"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  COMPOSER_ALLOW_SUPERUSER: "1"

default:
  interruptible: true

  cache:
    key:
      files:
        - composer.lock

    paths:
      - .composer-cache/

    policy: pull-push


# ============================================================
# CONFIGURATION PHP COMMUNE
# ============================================================

.php_setup:
  before_script:
    - apk add --no-cache
        git
        unzip
        curl
        libzip-dev
        libpng-dev
        libjpeg-turbo-dev
        freetype-dev
        oniguruma-dev
        icu-dev
        sqlite-dev
        libxml2-dev
        postgresql-dev

    - docker-php-ext-configure gd --with-freetype --with-jpeg

    - docker-php-ext-install
        gd
        mbstring
        zip
        intl
        pdo_mysql
        pdo_sqlite
        pdo_pgsql
        dom

    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"

    - php composer-setup.php
        --install-dir=/usr/local/bin
        --filename=composer

    - php -r "unlink('composer-setup.php');"

    - php --version
    - composer --version

# ============================================================
# 1. INSTALLATION DES DÉPENDANCES
# ============================================================

install_dependencies:
  extends: .php_setup
  stage: install

  script:
    - composer install
        --no-interaction
        --prefer-dist
        --no-progress
        --optimize-autoloader

    - composer check-platform-reqs

  artifacts:
    expire_in: 1 hour

    paths:
      - vendor/


# ============================================================
# 2. VALIDATION ET QUALITÉ
# ============================================================

code_quality:
  extends: .php_setup
  stage: quality

  needs:
    - job: install_dependencies
      artifacts: true

  before_script:
    - !reference [.php_setup, before_script]
    - cp .env.example .env
    - php artisan key:generate

  script:
    - composer validate --no-check-publish
    - php artisan --version
    - php artisan config:clear
    - php artisan route:list


# ============================================================
# 3. TESTS LARAVEL
# ============================================================

tests:
  extends: .php_setup
  stage: test

  services:
    - name: postgres:17-alpine
      alias: postgres

  needs:
    - job: install_dependencies
      artifacts: true

  variables:
    POSTGRES_DB: "materiel_test"
    POSTGRES_USER: "materiel"
    POSTGRES_PASSWORD: "materiel"

    DB_CONNECTION: "pgsql"
    DB_HOST: "postgres"
    DB_PORT: "5432"
    DB_DATABASE: "materiel_test"
    DB_USERNAME: "materiel"
    DB_PASSWORD: "materiel"

    CACHE_STORE: "array"
    CACHE_DRIVER: "array"
    SESSION_DRIVER: "array"
    QUEUE_CONNECTION: "sync"
    MAIL_MAILER: "array"

  before_script:
    - !reference [.php_setup, before_script]

    - apk add --no-cache postgresql-client postgresql-dev

    - docker-php-ext-install pdo_pgsql

    - cp .env.example .env

    - php artisan key:generate

    - php artisan config:clear

    - |
      echo "Attente du démarrage de PostgreSQL..."

      for i in $(seq 1 30); do
        if pg_isready \
          -h postgres \
          -p 5432 \
          -U materiel \
          -d materiel_test; then
          echo "PostgreSQL est disponible."
          break
        fi

        echo "PostgreSQL indisponible - tentative $i/30"
        sleep 2
      done

    - |
      pg_isready \
        -h postgres \
        -p 5432 \
        -U materiel \
        -d materiel_test

    - php artisan migrate:fresh --force

  script:
    - php artisan test

  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - storage/logs/

# ============================================================
# 4. AUDIT COMPOSER
# ============================================================

composer_audit:
  extends: .php_setup
  stage: security

  needs:
    - job: install_dependencies
      artifacts: true

  script:
    - composer audit || true

  allow_failure: true


# ============================================================
# 5. SÉCURITÉ GITLAB
# ============================================================

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml