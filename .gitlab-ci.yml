image: php:8.2-cli-alpine

stages:
  - install
  - quality
  - test
  - security

variables:
  APP_ENV: "testing"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  COMPOSER_ALLOW_SUPERUSER: "1"

default:
  interruptible: true

  cache:
    key:
      files:
        - composer.lock
    paths:
      - .composer-cache/
    policy: pull-push


# ============================================================
# 1. INSTALLATION DES DÉPENDANCES
# ============================================================

install_dependencies:
  stage: install

  before_script:
    - apk add --no-cache git unzip composer libzip-dev libpng-dev libjpeg-turbo-dev freetype-dev oniguruma-dev icu-dev sqlite-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install gd mbstring zip intl pdo_mysql pdo_sqlite
    - php --version
    - composer --version
    - php -m | grep -i gd

  script:
    - composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

  artifacts:
    expire_in: 1 hour
    paths:
      - vendor/


# ============================================================
# 2. VÉRIFICATION DU PROJET
# ============================================================

code_quality:
  stage: quality

  needs:
    - job: install_dependencies
      artifacts: true

  before_script:
    - apk add --no-cache libzip libpng libjpeg-turbo freetype oniguruma icu-libs sqlite
    - cp .env.example .env
    - php artisan key:generate

  script:
    - php artisan --version
    - php artisan config:clear
    - php artisan route:list
    - composer validate --no-check-publish


# ============================================================
# 3. TESTS LARAVEL
# ============================================================

tests:
  stage: test

  needs:
    - job: install_dependencies
      artifacts: true

  variables:
    DB_CONNECTION: "sqlite"
    DB_DATABASE: "$CI_PROJECT_DIR/database/database.sqlite"
    CACHE_STORE: "array"
    SESSION_DRIVER: "array"
    QUEUE_CONNECTION: "sync"
    MAIL_MAILER: "array"

  before_script:
    - apk add --no-cache libzip libpng libjpeg-turbo freetype oniguruma icu-libs sqlite
    - cp .env.example .env
    - php artisan key:generate
    - mkdir -p database
    - touch database/database.sqlite
    - php artisan config:clear
    - php artisan cache:clear

  script:
    - php artisan test

  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - storage/logs/


# ============================================================
# 4. AUDIT DE SÉCURITÉ COMPOSER
# ============================================================

composer_audit:
  stage: security

  needs:
    - job: install_dependencies
      artifacts: true

  before_script:
    - apk add --no-cache composer

  script:
    - composer audit || true

  allow_failure: true


# ============================================================
# 5. SÉCURITÉ GITLAB
# ============================================================

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml